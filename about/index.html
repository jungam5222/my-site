<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About · yunmin.dev</title>
  <meta name="description" content="홍윤민 소개: CV 요약, 지나온 길, 자주 쓰는 도구, 그리고 쓸데없는 이야기.">
  <meta name="theme-color" content="#FBF8F1">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-page="about">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="eyebrow">/about</p>
        <h1 id="about-name">홍윤민</h1>
        <p class="lead" id="about-intro"></p>
      </div>
    </header>

    <section id="summary" data-color="red" data-title="요약">
      <div class="wrap">
        <div id="cv-head"></div>
        <div class="panel reveal"><div id="about-cv"></div></div>
      </div>
    </section>

    <section id="path" data-color="orange" data-title="지나온 길">
      <div class="wrap">
        <div id="tl-head"></div>
        <ol class="timeline reveal" id="timeline"></ol>
      </div>
    </section>

    <section id="toolbox" data-color="yellow" data-title="Toolbox">
      <div class="wrap">
        <div id="stack-head"></div>
        <div class="panel reveal"><div id="stack-list"></div></div>
      </div>
    </section>

    <section id="facts" data-color="lime" data-title="About Me">
      <div class="wrap">
        <div id="facts-head"></div>
        <div class="reveal" id="about-facts"></div>
      </div>
    </section>

    <section id="contact" data-color="green" data-title="Contact">
      <div class="wrap">
        <div class="contact reveal">
          <h2>연락은 언제든 환영이에요</h2>
          <p>커피챗, 해커톤 팀 구성, 같이 볼더링 하기 전부 좋아요.</p>
          <div class="hero-cta" id="contact-links"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/holds.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/site.js"></script>
</body>
</html>
