<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climbing · yunmin.dev</title>
  <meta name="description" content="홍윤민의 클라이밍 기록: 그레이드, 완등 로그, 자주 가는 암장.">
  <meta name="theme-color" content="#FBF8F1">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-page="climbing">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="eyebrow">/climbing</p>
        <h1>Climbing 🧗</h1>
        <p class="lead">이 사이트가 온통 홀드인 이유. 코드가 안 풀릴 땐 벽에 매달립니다.</p>
      </div>
    </header>

    <section id="stats" style="padding-top:32px">
      <div class="wrap">
        <div class="stats reveal" id="climb-stats"></div>
      </div>
    </section>

    <section id="record" style="padding-top:8px">
      <div class="wrap two-col">
        <div class="reveal">
          <div class="sec-head"><span class="tape" style="--c:#2F6BDB">V</span><h2>그레이드별 완등</h2></div>
          <div class="panel"><div class="bars" id="grade-chart"></div></div>
        </div>
        <div class="reveal">
          <div class="sec-head"><span class="tape" style="--c:#F2BE22">LOG</span><h2>최근 완등</h2></div>
          <ul class="climb-log" id="climb-log"></ul>
        </div>
      </div>
    </section>

    <section id="gyms-sec" style="padding-top:8px">
      <div class="wrap">
        <div class="sec-head"><span class="tape" style="--c:#1FA5A0">GYM</span><h2>자주 가는 암장</h2></div>
        <div class="facts reveal" id="gyms"></div>
      </div>
    </section>
  </main>

  <script src="/assets/js/holds.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/site.js"></script>
</body>
</html>
