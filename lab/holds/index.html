<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold Generator · yunmin.dev</title>
  <meta name="description" content="버튼 한 번에 새로운 클라이밍 홀드를 만들어 보세요.">
  <meta name="theme-color" content="#FBF8F1">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-page="lab">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="eyebrow"><a href="/lab/">/lab</a> / holds</p>
        <h1>Hold Generator</h1>
        <p class="lead">랜덤 시드로 클라이밍 홀드를 그려요. 같은 시드는 언제나 같은 홀드가 나옵니다. 마음에 드는 건 SVG로 저장할 수 있어요.</p>
      </div>
    </header>
    <section>
      <div class="wrap gen">
        <div class="gen-stage" id="stage"></div>
        <div class="gen-controls">
          <div>
            <label>색</label>
            <div class="swatches" id="swatches"></div>
          </div>
          <div>
            <label>종류</label>
            <div class="seg" id="types"></div>
          </div>
          <div>
            <label>시드</label>
            <p class="gen-seed" id="seed"></p>
          </div>
          <div class="hero-cta" style="margin-top:0">
            <button class="btn primary" type="button" id="roll">새 홀드 만들기 🎲</button>
            <button class="btn" type="button" id="save">SVG 저장</button>
          </div>
          <div>
            <label>지금까지 만든 홀드</label>
            <div class="gen-history" id="history"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/holds.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/site.js"></script>
  <script>
    (function () {
      const H = window.Holds;
      const state = { seed: Math.floor(Math.random() * 99999), color: 'random', type: 'random' };
      const history = [];
      const $ = (id) => document.getElementById(id);

      const pick = (arr, seed) => arr[seed % arr.length];
      const current = () => ({
        seed: state.seed,
        color: state.color === 'random' ? pick(H.COLOR_KEYS, state.seed) : state.color,
        type: state.type === 'random' ? pick(H.TYPE_KEYS, Math.floor(state.seed / 7)) : state.type,
      });

      $('swatches').innerHTML =
        `<button class="swatch on" type="button" data-c="random" title="랜덤" style="--c:conic-gradient(#E5483B,#F2BE22,#2E9E5B,#2F6BDB,#8B55D6,#E5483B)"></button>` +
        H.COLOR_KEYS.map((k) => `<button class="swatch" type="button" data-c="${k}" title="${H.PALETTE[k].ko}" style="--c:${H.PALETTE[k].hex}"></button>`).join('');
      const TYPE_KO = { jug: '저그', crimp: '크림프', sloper: '슬로퍼', pinch: '핀치', pocket: '포켓', edge: '엣지' };
      $('types').innerHTML = `<button class="on" type="button" data-t="random">랜덤</button>` +
        H.TYPE_KEYS.map((k) => `<button type="button" data-t="${k}">${TYPE_KO[k] || k}</button>`).join('');

      function draw(addToHistory) {
        const c = current();
        $('stage').innerHTML = H.svg({ seed: c.seed, color: c.color, type: c.type, size: 320 });
        $('seed').textContent = `#${c.seed} · ${H.PALETTE[c.color].ko} ${TYPE_KO[c.type]}`;
        if (addToHistory) {
          history.unshift(c);
          history.splice(16);
          $('history').innerHTML = history.map((h, i) =>
            `<button type="button" data-i="${i}" title="#${h.seed}">${H.svg({ seed: h.seed, color: h.color, type: h.type, size: 48 })}</button>`).join('');
        }
      }

      $('swatches').addEventListener('click', (e) => {
        const b = e.target.closest('.swatch'); if (!b) return;
        state.color = b.dataset.c;
        $('swatches').querySelectorAll('.swatch').forEach((x) => x.classList.toggle('on', x === b));
        draw(false);
      });
      $('types').addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        state.type = b.dataset.t;
        $('types').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
        draw(false);
      });
      $('roll').addEventListener('click', () => { state.seed = Math.floor(Math.random() * 99999); draw(true); });
      $('history').addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        const h = history[+b.dataset.i];
        $('stage').innerHTML = H.svg({ seed: h.seed, color: h.color, type: h.type, size: 320 });
        $('seed').textContent = `#${h.seed} · ${H.PALETTE[h.color].ko} ${TYPE_KO[h.type]}`;
      });
      $('save').addEventListener('click', () => {
        const svg = $('stage').innerHTML.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
        const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
        const a = document.createElement('a');
        a.href = url; a.download = `hold-${state.seed}.svg`; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      draw(true);
    })();
  </script>
</body>
</html>
